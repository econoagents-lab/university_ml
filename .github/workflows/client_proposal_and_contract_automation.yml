name: Client Proposal and Contract Automation

on:
  workflow_dispatch:
  push:
    paths:
      - "config/client_tenants.yml"
      - "config/client_proposals.yml"
      - "src/mlu/client_proposal_and_contract_automation.py"
      - "scripts/117_build_client_proposals.py"
      - "scripts/118_validate_client_proposals.py"
      - "scripts/119_generate_client_contracts.py"
      - "scripts/120_run_v23_client_proposal_and_contract_automation.py"

permissions:
  contents: read

jobs:
  build-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build proposals
        run: python scripts/120_run_v23_client_proposal_and_contract_automation.py
      - name: Publish summary
        if: always()
        run: |
          cat reports/client_proposals/CLIENT_PROPOSAL_INDEX.md >> $GITHUB_STEP_SUMMARY
      - name: Upload proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-proposals
          path: reports/client_proposals/
