name: Dashboard Catalog Control

on:
  workflow_dispatch:
  push:
    paths:
      - "config/dashboard_catalog.yml"
      - "config/dashboard_params.yml"
      - "config/model_params.yml"
      - "config/privacy_policy.yml"
      - "src/mlu/dashboard_control.py"
      - "scripts/7*_*.py"

permissions:
  contents: read


jobs:
  validate-dashboard-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pandas numpy scikit-learn joblib fastapi pydantic httpx

      - name: Generate dashboard control panel
        run: |
          python scripts/76_run_v13_dashboard_control.py

      - name: Publish summary
        if: always()
        run: |
          cat reports/dashboard_control/DASHBOARD_CONTROL_PANEL.md >> $GITHUB_STEP_SUMMARY

      - name: Upload dashboard control artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-catalog-control
          path: |
            reports/dashboard_control/DASHBOARD_CONTROL_PANEL.md
            reports/dashboard_control/INPUTS_TO_CONFIRM.md
            reports/dashboard_control/dashboard_parameter_validation.json
