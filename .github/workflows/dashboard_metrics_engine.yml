name: Dashboard Metrics Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "config/dashboard_metrics.yml"
      - "config/dashboard_catalog.yml"
      - "src/mlu/dashboard_metrics_engine.py"
      - "src/mlu/dashboard_generator.py"
      - "scripts/8*.py"
      - "reports/public/decision_dashboard_payload_public.json"
      - "reports/uni_final/RAGAS_LIKE_SUMMARY.md"

permissions:
  contents: read

jobs:
  dashboard-metrics-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build dashboard metrics engine
        run: python scripts/84_run_v15_dashboard_metrics_engine.py
      - name: Publish summary
        if: always()
        run: cat reports/dashboard_metrics/DASHBOARD_METRICS_ENGINE.md >> $GITHUB_STEP_SUMMARY
      - name: Upload dashboard metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-metrics-engine
          path: |
            reports/dashboard_metrics/**
            reports/generated_dashboards/**
