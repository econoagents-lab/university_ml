name: Experiment Power Policy Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "src/mlu/experiment_power_policy_engine.py"
      - "config/experiment_power_policy_engine.yml"
      - "scripts/10*.py"
      - "tests/test_experiment_power_policy_engine.py"

permissions:
  contents: read

jobs:
  experiment-power-policy-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run v1.9 policy engine
        run: python scripts/104_run_v19_experiment_power_policy_engine.py
      - name: Publish policy summary
        if: always()
        run: cat reports/policy_engine/EXPERIMENT_POWER_AND_POLICY_ENGINE.md >> $GITHUB_STEP_SUMMARY
      - name: Run tests
        run: pytest -q tests/test_experiment_power_policy_engine.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-power-policy-engine
          path: |
            data/processed/policy_engine/
            reports/policy_engine/
