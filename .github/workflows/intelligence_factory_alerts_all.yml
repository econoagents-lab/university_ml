name: Intelligence Factory Alerts All

on:
  workflow_dispatch:
  schedule:
    # 13:30 UTC = 08:30 Lima. Yo lo uso como revisión diaria amigable.
    - cron: "30 13 * * 1-5"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  all-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml

      - name: Build all alerts
        run: |
          python scripts/66_build_all_alerts.py

      - name: Publish all summaries
        if: always()
        run: |
          cat reports/alerts/ALERTS_MANIFEST.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/alerts/EXECUTIVE_KPI_DIGEST.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/alerts/RAGAS_ALERT.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/alerts/UNI_READINESS_ALERT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build consolidated issue body
        if: always()
        run: |
          python scripts/64_create_alert_issue_body.py --alert-type all --output reports/alerts/ALERT_ISSUE_BODY.md

      - name: Upload all alert artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-factory-alerts
          retention-days: 30
          path: |
            reports/alerts/**
            data/processed/scoring/ranking_operaciones_riesgo_caida.csv
            reports/uni_final/RAGAS_LIKE_SUMMARY.md
            reports/uni_final/FINAL_TECHNICAL_REPORT.md
            docs/TRACEABILITY_TABLE_UNI.md
