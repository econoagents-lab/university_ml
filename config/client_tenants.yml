version: "2.2.0"
product_name: "Commercial Intelligence OS"
packaging_mode: "multi_tenant_demo_safe"
defaults:
  data_mode: "crm_aggregated"
  require_token: true
  anonymize_advisors: true
  expose_project_names: true
  expose_channels: true
  max_public_top_n: 5
  allowed_public_payload_fields:
    - total_operaciones
    - valor_total_en_riesgo
    - riesgo_promedio
    - p0_p1
    - top_proyectos
    - top_asesores
    - top_canales
    - fecha_generacion
    - data_mode
  forbidden_public_fields:
    - cliente
    - clientes
    - documento
    - dni
    - email
    - correo
    - telefono
    - teléfono
    - celular
    - direccion
    - dirección
    - nombre_completo
    - codigo_proforma
    - codigo_unidad
    - password
    - secret
    - token
    - redshift_password
    - credenciales

tenants:
  - tenant_id: "cliente_alpha"
    display_name: "Cliente Alpha · Desarrollador multifamiliar"
    segment: "desarrollador_inmobiliario"
    brand_theme: "dark_gold"
    token_env_var: "MLU_DEMO_TOKEN_CLIENTE_ALPHA"
    enabled_modules:
      - ceo_brief
      - railway_public_dashboard
      - risk_to_action_queue
      - stock_pricing
      - rag_business_memory
      - github_alerts
    commercial_focus: "Riesgo de caída, tubería envejecida y valor esperado en riesgo."
    primary_cta: "Ver tablero ejecutivo"
    landing_title: "Una sala de control para salvar ventas antes de que caigan."
    landing_subtitle: "Demo segura con datos agregados: riesgo, proyectos, canales y política comercial sin exponer clientes."
    public_routes:
      - "/public/decision-dashboard"
      - "/dashboard/catalog"
      - "/dashboard/action-feedback"
      - "/dashboard/experiment-power-policy"
    payload_overrides:
      top_n: 5
      include_value_at_risk: true
      include_rag_quality: true

  - tenant_id: "cliente_bravo"
    display_name: "Cliente Bravo · Gerencia comercial"
    segment: "gerencia_comercial"
    brand_theme: "dark_blue"
    token_env_var: "MLU_DEMO_TOKEN_CLIENTE_BRAVO"
    enabled_modules:
      - ceo_brief
      - funnel_conversion
      - advisor_project_matrix
      - risk_to_action_queue
      - feedback_loop
      - experiment_policy
    commercial_focus: "Conversión, asesores, SLA comercial y cumplimiento de acciones."
    primary_cta: "Revisar política comercial"
    landing_title: "De seguimiento manual a política comercial medible."
    landing_subtitle: "Una demo para ver qué equipo, canal o proyecto requiere acción y cómo medir si funcionó."
    public_routes:
      - "/dashboard/action-feedback"
      - "/experiments/policy/recommendations"
      - "/experiments/policy/segments"
      - "/product/demo/package"
    payload_overrides:
      top_n: 5
      include_value_at_risk: true
      include_compliance: true

  - tenant_id: "cliente_condor"
    display_name: "Cliente Cóndor · Comité de inversión"
    segment: "inversion_y_directorio"
    brand_theme: "black_platinum"
    token_env_var: "MLU_DEMO_TOKEN_CLIENTE_CONDOR"
    enabled_modules:
      - ceo_brief
      - real_mart_evidence_layer
      - market_intelligence
      - pricing_gap
      - productized_os
      - privacy_audit
    commercial_focus: "Stock, pricing, evidencia real vs proxy y narrativa para comité."
    primary_cta: "Ver evidencia económica"
    landing_title: "Una fábrica de evidencia para decidir stock, precio y riesgo."
    landing_subtitle: "El comité ve agregados, trazabilidad y brechas de evidencia sin tocar data personal ni CRM crudo."
    public_routes:
      - "/dashboard/real-marts"
      - "/dashboard/productized-os"
      - "/metadata/real-marts"
      - "/metadata/productized-os"
    payload_overrides:
      top_n: 5
      include_market_proxy_status: true
      include_privacy_status: true
